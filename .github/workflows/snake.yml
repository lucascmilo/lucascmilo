# Nome do Workflow
name: Generate Snake Animation

# Controles de quando a Action vai rodar
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Tarefas que o workflow vai executar
jobs:
  build:
    runs-on: ubuntu-latest

    # ADICIONADO AQUI: Permissão para a Action escrever no repositório
    permissions:
      contents: write

    steps:
      # Passo 1: Puxa o código do seu repositório
      - uses: actions/checkout@v3

      # Passo 2: Gera a animação da cobrinha
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Passo 3: Envia os arquivos gerados de volta para o seu repositório
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
